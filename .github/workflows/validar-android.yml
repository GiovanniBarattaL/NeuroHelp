name: Validar Android
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Instalar SDK do projeto
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Testes e APK de depuração
        run: bash gradlew testDebugUnitTest assembleDebug --no-daemon
      - name: Relatórios de testes
        if: ${{ always() && hashFiles('app/build/reports/tests/**') != '' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: testes-android
          path: app/build/reports/tests/
